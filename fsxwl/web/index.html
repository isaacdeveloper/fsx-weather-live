<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FSX Weather Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, Segoe UI, sans-serif; display: flex; height: 100vh; color: #1b1f24; }
  #side { width: 380px; max-width: 45vw; overflow-y: auto; padding: 12px; background: #f6f7f9; border-right: 1px solid #d8dce2; }
  #map { flex: 1; }
  h1 { font-size: 17px; margin: 0 0 8px; }
  .card { background: #fff; border: 1px solid #d8dce2; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row input[type=text] { flex: 1; padding: 6px 8px; border: 1px solid #b9c0ca; border-radius: 6px; }
  button { padding: 6px 10px; border: 1px solid #3b6fd4; background: #3b6fd4; color: #fff; border-radius: 6px; cursor: pointer; }
  button.sec { background: #fff; color: #3b6fd4; }
  button.off { background: #fff; color: #b3261e; border-color: #b3261e; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: #b3261e; }
  .dot.ok { background: #1a7f37; }
  .st { border-top: 1px solid #eceff3; padding: 6px 0; cursor: pointer; }
  .st:first-child { border-top: 0; }
  .st b { font-size: 13px; }
  .muted { color: #667085; font-size: 12px; }
  .raw { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; word-break: break-all; color: #475467; }
  .warn { color: #b3261e; }
  pre { margin: 0; max-height: 140px; overflow: auto; font-size: 11px; background: #101418; color: #d6dde6; padding: 8px; border-radius: 6px; white-space: pre-wrap; }
  .wxm { display: flex; align-items: center; gap: 2px; white-space: nowrap; background: rgba(255,255,255,.88);
         border: 1.5px solid var(--c, #3b6fd4); border-radius: 12px; padding: 1px 6px 1px 3px; font-size: 11px; font-weight: 600;
         box-shadow: 0 1px 3px rgba(0,0,0,.25); width: max-content; transform: translate(-50%, -50%); cursor: pointer; }
  .wxm .id { color: var(--c, #3b6fd4); font-weight: 700; margin-right: 2px; letter-spacing: .02em; }
  .wxm .ic { font-size: 18px; line-height: 20px; }
  .wxm svg { display: block; }
  #wxpanel { background: rgba(255,255,255,.95); border-radius: 10px; padding: 10px 12px; min-width: 200px;
             box-shadow: 0 2px 8px rgba(0,0,0,.25); font: 13px/1.35 system-ui, Segoe UI, sans-serif; color: #1b1f24; }
  #wxpanel .hd { font-size: 11px; color: #667085; text-transform: uppercase; letter-spacing: .03em; }
  #wxpanel .big { display: flex; align-items: center; gap: 10px; margin: 4px 0 6px; }
  #wxpanel .big .ic { font-size: 42px; line-height: 46px; }
  #wxpanel .big .tp { font-size: 26px; font-weight: 700; }
  #wxpanel .wind { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  #wxpanel .wind svg { flex: none; }
  #wxpanel .det { color: #475467; font-size: 12px; margin-top: 4px; }
  #wxpanel .tg { float: right; cursor: pointer; color: #667085; margin-left: 8px; font-size: 14px; }
  .plane { font-size: 24px; line-height: 24px; text-align: center; color: #b3261e; text-shadow: 0 0 3px #fff; }

  details.card > summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 6px; }
  details.card > summary::before { content: '▸'; color: #667085; }
  details.card[open] > summary::before { content: '▾'; }
  .cu h4 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #667085; }
  .cu .grid { display: grid; grid-template-columns: 92px 1fr 56px; gap: 4px 6px; align-items: center; }
  .cu .grid input[type=range] { width: 100%; }
  .cu .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; }
  .cu select, .cu input[type=number], .cu input.icao { padding: 4px 6px; border: 1px solid #b9c0ca; border-radius: 6px; font: inherit; background: #fff; }
  .cu input.icao { width: 70px; text-transform: uppercase; }
  .cu .seg { display: inline-flex; border: 1px solid #b9c0ca; border-radius: 6px; overflow: hidden; }
  .cu .seg button { border: 0; border-radius: 0; background: #fff; color: #1b1f24; padding: 4px 9px; }
  .cu .seg button.on { background: #3b6fd4; color: #fff; }
  .cu .dialwrap { display: flex; gap: 10px; align-items: center; }
  .cu #cu_dial { width: 170px; height: 170px; flex: none; touch-action: none; cursor: grab; user-select: none; }
  .cu .rel { font-size: 12px; line-height: 1.5; }
  .cu .rel .h { color: #1a7f37; font-weight: 700; } .cu .rel .t { color: #b3261e; font-weight: 700; } .cu .rel .x { color: #b45309; font-weight: 700; }
  .cu .quick { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .cu .quick button { padding: 3px 7px; font-size: 12px; }
  .cu .layer { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .cu .layer input[type=number] { width: 84px; }
  .cu .metar { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: #101418; color: #9be29b; padding: 6px 8px; border-radius: 6px; word-break: break-all; margin-top: 6px; }
  .cu .active { background: #fff4e5; border: 1px solid #f0b35a; border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; font-size: 12px; }
</style>
</head>
<body>
<div id="side">
  <div class="row"><h1 style="flex:1">FSX Weather Live</h1><button class="sec" id="langbtn" title="Language / Idioma">EN</button></div>

  <div class="card">
    <div><span id="simdot" class="dot"></span><span id="simtxt"></span></div>
    <div class="muted" id="simpos"></div>
    <div class="muted warn" id="simerr"></div>
    <label class="row" style="margin-top:6px"><input type="checkbox" id="follow" checked> <span data-i18n="follow"></span></label>
    <label class="row" style="margin-top:4px"><input type="checkbox" id="overlay"> <span data-i18n="overlay"></span></label>
  </div>

  <div class="card">
    <div class="row">
      <b id="injtxt"></b>
      <span style="flex:1"></span>
      <button id="injbtn"></button>
    </div>
    <div class="row" style="margin-top:6px"><button class="sec" id="diagbtn" data-i18n="diag"></button>
      <span class="muted" id="diagmsg"></span></div>
    <div class="muted" id="injnote"></div>
  </div>


  <details class="card cu" id="cu">
    <summary><span data-i18n="cuTitle"></span><span style="flex:1"></span><span class="muted" id="cu_badge"></span></summary>
    <div id="cu_active" class="active" style="display:none"></div>

    <div class="row" style="margin-top:8px">
      <select id="cu_preset" style="flex:1;min-width:0"></select>
      <button class="sec" id="cu_save" data-i18n="cuSave"></button>
      <button class="sec" id="cu_del" title="" style="padding:6px 8px">🗑</button>
    </div>
    <div class="row" style="margin-top:6px">
      <span class="muted" data-i18n="cuFromReal"></span>
      <input class="icao" id="cu_src" maxlength="4" placeholder="LEMD">
      <button class="sec" id="cu_load" data-i18n="cuLoad"></button>
    </div>
    <div class="muted warn" id="cu_srcmsg"></div>

    <h4 data-i18n="cuWhere"></h4>
    <label class="row"><input type="radio" name="cu_scope" value="area" checked> <span data-i18n="cuArea"></span></label>
    <label class="row"><input type="radio" name="cu_scope" value="station"> <span data-i18n="cuStation"></span>
      <input class="icao" id="cu_icao" maxlength="4" placeholder="LERS"></label>
    <div class="muted" data-i18n="cuStationHint"></div>

    <h4 data-i18n="windL"></h4>
    <div class="dialwrap">
      <svg id="cu_dial" viewBox="0 0 200 200"></svg>
      <div style="flex:1">
        <div style="font-size:19px;font-weight:700;white-space:nowrap" id="cu_windtxt"></div>
        <label class="row muted"><input type="checkbox" id="cu_vrb"> <span data-i18n="vrb"></span></label>
        <div class="rel" id="cu_rel"></div>
      </div>
    </div>
    <div class="muted" data-i18n="cuDialHint"></div>
    <div class="quick" id="cu_quick"></div>
    <div class="grid" style="margin-top:6px">
      <span data-i18n="cuSpeed"></span><input type="range" id="cu_kt" min="0" max="70" step="1"><span class="val" id="cu_kt_v"></span>
      <span data-i18n="cuGust"></span><input type="range" id="cu_gust" min="0" max="90" step="1"><span class="val" id="cu_gust_v"></span>
      <span data-i18n="cuVar"></span><input type="range" id="cu_var" min="0" max="90" step="10"><span class="val" id="cu_var_v"></span>
    </div>

    <h4 data-i18n="cuSky"></h4>
    <div class="grid">
      <span data-i18n="visL"></span>
      <select id="cu_vis" style="grid-column: span 2"></select>
      <span data-i18n="cuPrecip"></span>
      <select id="cu_wx" style="grid-column: span 2"></select>
      <span data-i18n="cuInt"></span>
      <span class="seg" id="cu_int" style="grid-column: span 2"><button data-v="-"></button><button data-v=""></button><button data-v="+"></button></span>
    </div>
    <div class="muted" style="margin:8px 0 4px" data-i18n="cuClouds"></div>
    <div id="cu_layers"></div>

    <h4 data-i18n="cuAir"></h4>
    <div class="grid">
      <span data-i18n="cuTemp"></span><input type="range" id="cu_temp" min="-40" max="45" step="1"><span class="val" id="cu_temp_v"></span>
      <span data-i18n="dewL"></span><input type="range" id="cu_dew" min="-45" max="35" step="1"><span class="val" id="cu_dew_v"></span>
      <span>QNH</span><input type="range" id="cu_qnh" min="950" max="1050" step="1"><span class="val" id="cu_qnh_v"></span>
    </div>
    <div class="muted" id="cu_qnh_in"></div>

    <h4 data-i18n="cuApplyH"></h4>
    <div class="row"><span data-i18n="cuTrans"></span>
      <select id="cu_secs"><option value="0"></option><option value="60"></option><option value="300"></option><option value="900"></option></select></div>
    <div class="metar" id="cu_metar"></div>
    <div class="row" style="margin-top:8px">
      <button id="cu_apply" data-i18n="cuApply" style="flex:1"></button>
      <button class="off" id="cu_clear" data-i18n="cuClear"></button>
    </div>
    <div class="muted" id="cu_msg"></div>
  </details>

  <div class="card">
    <div class="row">
      <input type="text" id="q" data-i18n-ph="ph">
      <button id="go" data-i18n="search"></button>
    </div>
    <div class="muted" id="searchmsg"></div>
  </div>

  <div class="card">
    <div class="row"><b data-i18n="near"></b><span style="flex:1"></span>
      <button class="sec" id="refresh" data-i18n="refresh"></button></div>
    <div class="muted" id="upd"></div>
    <div class="muted warn" id="fetcherr"></div>
    <div class="muted" id="areamsg"></div>
    <div id="list"></div>
  </div>

  <div class="card"><b data-i18n="logt"></b><pre id="log"></pre></div>
  <div class="muted" data-i18n="credits"></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([40.47, -3.56], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18, attribution: '© OpenStreetMap'}).addTo(map);
const stationLayer = L.layerGroup().addTo(map);
const areaLayer = L.layerGroup().addTo(map);
const searchLayer = L.layerGroup().addTo(map);
let areaStations = [], areaKey = '', areaAt = 0, areaTimer = null, areaSeq = 0, areaInfo = null;
let planeMarker = null, centered = false, injectOn = false, lastUpdated = null, lastStations = [], lastPos = null;

// ---------- weather symbols ----------
const WX_ICON = {clear: '☀️', few: '🌤️', partly: '⛅', cloudy: '🌥️', overcast: '☁️', mist: '🌫️', fog: '🌫️',
                 haze: '🌫️', drizzle: '🌦️', rain: '🌧️', showers: '🌦️', snow: '🌨️', hail: '🌨️', thunder: '⛈️', unknown: '❔'};
const WX_NIGHT = {clear: '🌙', few: '🌙', partly: '☁️'};
// Approximate solar elevation (degrees), used to show the moon at night.
function sunElev(lat, lon, ms) {
  const d = ms / 86400000 - 10957.5, g = (357.529 + 0.98560028 * d) * Math.PI / 180;
  const q = 280.459 + 0.98564736 * d, Lr = (q + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * Math.PI / 180;
  const e = (23.439 - 0.00000036 * d) * Math.PI / 180, dec = Math.asin(Math.sin(e) * Math.sin(Lr));
  const ra = Math.atan2(Math.cos(e) * Math.sin(Lr), Math.cos(Lr)) * 180 / Math.PI;
  const gmst = (18.697374558 + 24.06570982441908 * d) * 15, ha = (gmst + lon - ra) * Math.PI / 180, la = lat * Math.PI / 180;
  return Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha)) * 180 / Math.PI;
}
function wxIcon(s) {
  const c = (s.weather && s.weather.cond) || 'unknown';
  if (WX_NIGHT[c] && sunElev(s.lat, s.lon, Date.now()) < -3) return WX_NIGHT[c];
  return WX_ICON[c] || WX_ICON.unknown;
}
// Arrow pointing where the wind blows TO (METAR gives where it comes FROM).
function windArrow(w, size, color) {
  if (!w || (!w.kt && !w.gust_kt)) return '';
  if (w.dir == null) return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="${color}" stroke-width="2.5" stroke-dasharray="4 3"/></svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="transform:rotate(${(w.dir + 180) % 360}deg)"><path d="M12 2 L18.5 11 L14 11 L14 22 L10 22 L10 11 L5.5 11 Z" fill="${color}" stroke="#fff" stroke-width="1"/></svg>`;
}
function windColor(w) {
  const k = w ? Math.max(w.kt || 0, w.gust_kt || 0) : 0;
  return k >= 35 ? '#b3261e' : k >= 20 ? '#c2410c' : k >= 10 ? '#3b6fd4' : '#1a7f37';
}
function windText(w) {
  if (!w) return '';
  if (!w.kt && !w.gust_kt) return T('calm');
  return (w.dir == null ? T('vrb') : String(w.dir).padStart(3, '0') + '°') + ' ' + w.kt + (w.gust_kt ? 'G' + w.gust_kt : '') + ' kt';
}
function km(a, b, c, d) {
  const r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(x));
}

const WxPanel = L.Control.extend({
  options: {position: 'topright'},
  onAdd() {
    const div = L.DomUtil.create('div'); div.id = 'wxpanel';
    L.DomEvent.disableClickPropagation(div); L.DomEvent.disableScrollPropagation(div);
    return div;
  }
});
map.addControl(new WxPanel());
let panelMin = false;
try { panelMin = localStorage.getItem('wxpanelMin') === '1'; } catch (e) {}
// Corner panel: weather at the station nearest the aircraft (or the map's area if FSX is not connected).
function renderPanel() {
  const el = $('wxpanel');
  if (!lastStations.length) { el.style.display = 'none'; return; }
  el.style.display = '';
  let s = lastStations[0], dist = s.dist_km;
  if (lastPos) {
    dist = Infinity;
    lastStations.forEach(x => { const k = km(lastPos.lat, lastPos.lon, x.lat, x.lon); if (k < dist) { s = x; dist = k; } });
  }
  const w = s.weather || {}, col = windColor(w.wind);
  const tg = `<span class="tg" id="wxtg" title="${panelMin ? T('expand') : T('collapse')}">${panelMin ? '▸' : '▾'}</span>`;
  const hd = `<div class="hd">${tg}${T(lastPos ? 'wxPlane' : 'wxHere')} · ${s.icao}${dist != null ? ' · ' + Math.round(dist) + ' km' : ''}</div>`;
  if (panelMin) {
    el.innerHTML = hd + `<div class="wind" style="margin-top:4px"><span style="font-size:22px">${wxIcon(s)}</span>${w.temp != null ? w.temp + '°' : ''}${windArrow(w.wind, 22, col)}${windText(w.wind)}</div>`;
  } else {
    const det = [];
    if (w.vis_m != null) det.push(T('visL') + ' ' + (w.vis_m >= 9999 ? '≥10 km' : (w.vis_m / 1000).toFixed(1) + ' km'));
    if (w.dew != null) det.push(T('dewL') + ' ' + w.dew + '°C');
    if (w.qnh_hpa) det.push('QNH ' + w.qnh_hpa);
    el.innerHTML = hd +
      `<div class="big"><span class="ic">${wxIcon(s)}</span><div><div class="tp">${w.temp != null ? w.temp + '°C' : '–'}</div><div>${w.text || ''}</div></div></div>` +
      `<div class="wind">${windArrow(w.wind, 34, col)}<div>${T('windL')}<br><span style="color:${col}">${windText(w.wind) || '–'}</span></div></div>` +
      `<div class="det">${det.join(' · ')}</div>`;
  }
  $('wxtg').onclick = () => { panelMin = !panelMin; try { localStorage.setItem('wxpanelMin', panelMin ? '1' : '0'); } catch (e) {} renderPanel(); };
}


const $ = id => document.getElementById(id);
const I18N = {
  es: {follow: 'Seguir al avión en el mapa', overlay: 'Ventana de viento sobre FSX (FSX en ventana, Alt+Intro)', diag: 'Diagnóstico de formato', search: 'Buscar', near: 'Estaciones cercanas',
       refresh: 'Actualizar', logt: 'Registro', ph: 'Dirección o ICAO (p. ej. LEMD)',
       credits: 'Datos: NOAA Aviation Weather Center. Mapa: OpenStreetMap.',
       simOn: 'FSX conectado', simOff: 'FSX: sin conexión (el mapa funciona igualmente)',
       pos: (p) => `Lat ${p.lat.toFixed(3)}  Lon ${p.lon.toFixed(3)}  Alt ${Math.round(p.alt_ft)} ft  Rumbo ${Math.round(p.hdg)}°  GS ${Math.round(p.gs_kt)} kt`,
       injOn: 'Inyección en FSX: ACTIVADA', injOff: 'Inyección en FSX: desactivada', enable: 'Activar', disable: 'Desactivar',
       injHint: 'Empieza desactivada. Actívala con el vuelo ya cargado.',
       last: (t, m) => `Última descarga: ${t} (cada ${m} min)`, loading: 'Descargando…',
       confirm: 'Se va a cambiar el tiempo de FSX con datos reales.\nConviene tener el vuelo ya cargado. ¿Continuar?',
       searching: 'Buscando…', noStations: ' (sin estaciones cerca)',
       wxPlane: 'Tiempo en el avión', wxHere: 'Tiempo en la zona', windL: 'Viento', visL: 'Vis.', dewL: 'Rocío',
       inView: (n, t) => `En el mapa: ${n} aeropuertos${t > n ? ' de ' + t : ''} (se actualiza al mover o hacer zoom)`, areaErr: 'No se pudo cargar el tiempo de esta zona',
       calm: 'Calma', vrb: 'Variable', expand: 'Ampliar', collapse: 'Reducir',
       cuTitle: 'Crear mi tiempo', cuSave: 'Guardar', cuFromReal: 'Partir del tiempo real de', cuLoad: 'Cargar',
       cuWhere: 'Dónde', cuArea: 'Toda la zona (estaciones cercanas + global)', cuStation: 'Solo la estación',
       cuStationHint: 'Clic en un aeropuerto del mapa para rellenar el ICAO.',
       cuDialHint: 'Arrastra la flecha: marca de dónde VIENE el viento (Mayús = de 1 en 1).',
       cuSpeed: 'Velocidad', cuGust: 'Rachas', cuVar: 'Variación ±', cuSky: 'Cielo y visibilidad',
       cuPrecip: 'Fenómeno', cuInt: 'Intensidad', cuClouds: 'Capas de nubes (base en pies sobre el aeropuerto)',
       cuAir: 'Temperatura y presión', cuTemp: 'Temperatura', cuApplyH: 'Aplicar', cuTrans: 'Transición',
       cuApply: 'Aplicar en FSX', cuClear: 'Quitar', cuActive: 'Tiempo personalizado ACTIVO',
       cuConfirmClear: '¿Quitar el tiempo personalizado y devolver a FSX su tiempo?',
       cuSaveAsk: 'Nombre para guardar este tiempo:', cuMine: 'Mis tiempos', cuBuiltin: 'Predefinidos', cuPick: '— Elige un tiempo predefinido —',
       cuNoHdg: 'Conecta FSX para ver el viento respecto a tu rumbo.',
       cuRel: (h, x, side, hdg) => `Respecto a tu rumbo ${hdg}°:<br>${h}<br>${x}`,
       cuHead: k => `<span class="h">De cara ${k} kt</span>`, cuTail: k => `<span class="t">De cola ${k} kt</span>`,
       cuCross: (k, side) => `<span class="x">Cruzado ${k} kt ${side}</span>`, cuL: 'desde la izq.', cuR: 'desde la dcha.',
       qHead: 'De cara', qTail: 'De cola', qXL: 'Cruzado izq.', qXR: 'Cruzado dcha.', qCalm: 'Calma',
       trans: ['Inmediata', '1 minuto', '5 minutos', '15 minutos'],
       ints: ['Débil', 'Moderada', 'Fuerte'], none: 'Ninguno', noCloud: 'Sin nubes', cb: 'CB',
       covers: {FEW: 'Pocas (FEW)', SCT: 'Dispersas (SCT)', BKN: 'Muy nubosas (BKN)', OVC: 'Cubierto (OVC)'},
       wxNames: {RA: 'Lluvia', SHRA: 'Chubascos', DZ: 'Llovizna', FZRA: 'Lluvia engelante', FZDZ: 'Llovizna engelante',
                 SN: 'Nieve', SHSN: 'Chubascos de nieve', PE: 'Hielo granulado', TSRA: 'Tormenta con lluvia', TSSN: 'Tormenta con nieve',
                 TSGR: 'Tormenta con granizo', TS: 'Tormenta seca', BR: 'Neblina', FG: 'Niebla', FZFG: 'Niebla engelante',
                 HZ: 'Calima', SA: 'Arena', DU: 'Polvo'},
       presets: {cavok: 'Despejado (CAVOK)', vfr: 'VFR agradable', xwind: 'Práctica de viento cruzado (25G35 a 90°)',

function renderArea() {
  areaLayer.clearLayers();
  const near = new Set(lastStations.map(s => s.icao));
  areaStations.forEach(s => { if (!near.has(s.icao)) areaLayer.addLayer(stationMarker(s, '#475467')); });
  $('areamsg').textContent = areaInfo ? (areaInfo.error ? T('areaErr') : T('inView')(areaInfo.n, areaInfo.t)) : '';
}
async function loadArea(force) {
  const b = map.getBounds(), sz = map.getSize();
  const q = {s: b.getSouth(), w: b.getWest(), n: b.getNorth(), e: b.getEast(),
             cols: Math.max(2, Math.round(sz.x / 110)), rows: Math.max(2, Math.round(sz.y / 60))};
  const key = [q.s, q.w, q.n, q.e].map(v => v.toFixed(2)).join(',') + ',' + q.cols + 'x' + q.rows;
  if (!force && key === areaKey && Date.now() - areaAt < 60000) return;
  areaKey = key; areaAt = Date.now();
  const seq = ++areaSeq;
  let r;
  try { r = await (await fetch('/api/area?' + new URLSearchParams(q))).json(); } catch (e) { r = {error: String(e)}; }
  if (seq !== areaSeq) return;  // a newer request has started
  if (r.error) { areaInfo = {error: true}; areaAt = 0; renderArea(); return; }
  areaStations = r.stations || [];
  areaInfo = {n: areaStations.length, t: r.total || 0};
  renderArea();
}
map.on('moveend', () => { clearTimeout(areaTimer); areaTimer = setTimeout(() => loadArea(false), 400); });

async function tick() {
  let st;
  try { st = await (await fetch('/api/state')).json(); } catch (e) { return; }
  if (st.lang && st.lang !== lang) { applyLang(st.lang); cuLang(); }
  const sim = st.sim;
  $('simdot').className = 'dot' + (sim.connected ? ' ok' : '');
  $('simtxt').textContent = sim.connected ? T('simOn') : T('simOff');
  $('simerr').textContent = sim.connected ? '' : (sim.error || '');
  lastPos = sim.pos || null;
  if (sim.pos) {
    $('simpos').textContent = T('pos')(sim.pos);
    // SVG silhouette with the nose pointing north, so the heading applies directly (the ✈ glyph points ~45° depending on the font).
    const svg = '<svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 1.5 L14 9 L22.5 13.5 L22.5 15.5 L14 13.2 L13.6 19 L16.3 21 L16.3 22.6 L12 21.6 L7.7 22.6 L7.7 21 L10.4 19 L10 13.2 L1.5 15.5 L1.5 13.5 L10 9 Z" fill="#b3261e" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>';
    const icon = L.divIcon({className: '', html: `<div style="width:30px;height:30px;transform:rotate(${sim.pos.hdg}deg)">${svg}</div>`, iconSize: [30, 30], iconAnchor: [15, 15]});
    if (!planeMarker) planeMarker = L.marker([sim.pos.lat, sim.pos.lon], {icon}).addTo(map);
    else { planeMarker.setLatLng([sim.pos.lat, sim.pos.lon]); planeMarker.setIcon(icon); }
    if ($('follow').checked) map.setView([sim.pos.lat, sim.pos.lon], map.getZoom());
    centered = true;
  } else { $('simpos').textContent = ''; }

  $('overlay').checked = !!st.overlay;
  injectOn = st.inject.enabled;
  $('injtxt').textContent = injectOn ? T('injOn') : T('injOff');
  $('injbtn').textContent = injectOn ? T('disable') : T('enable');
  $('injbtn').className = injectOn ? 'off' : '';
  $('injnote').textContent = (st.custom && st.custom.active) ? '' : (st.inject.note || (injectOn ? '' : T('injHint')));

  $('upd').textContent = st.updated ? T('last')(new Date(st.updated * 1000).toLocaleTimeString(), st.update_minutes) : T('loading');
  $('fetcherr').textContent = st.fetch_error || '';
  if (st.updated !== lastUpdated) {
    lastUpdated = st.updated;
    const list = $('list'); list.replaceChildren();
    stationLayer.clearLayers();
    st.stations.forEach(s => { list.append(stationItem(s)); stationLayer.addLayer(stationMarker(s, '#3b6fd4')); });
    lastStations = st.stations;
    renderArea();
  }
  if (Date.now() - areaAt > st.update_minutes * 60000) loadArea(true);
  renderPanel();
  if (!centered && st.stations.length) { map.setView([st.center.lat, st.center.lon], 7); centered = true; }
  $('log').textContent = st.log.join('\n');
  cuState(st.custom || {active: false});
}

$('go').onclick = async () => {
  const q = $('q').value; $('searchmsg').textContent = T('searching');

  searchLayer.clearLayers();

const esc = t => String(t).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

function dialSvg() {
  const w = cu.wind, hdg = lastPos ? lastPos.hdg : null;
  let g = '<circle cx="100" cy="100" r="86" fill="#f6f7f9" stroke="#b9c0ca" stroke-width="2"/>';
  for (let a = 0; a < 360; a += 10) {
    const big = a % 30 === 0, r1 = big ? 74 : 79, s = Math.sin(a * Math.PI / 180), c = Math.cos(a * Math.PI / 180);
    g += `<line x1="${100 + 86 * s}" y1="${100 - 86 * c}" x2="${100 + r1 * s}" y2="${100 - r1 * c}" stroke="#98a2b3" stroke-width="${big ? 2 : 1}"/>`;
  }
  [['N', 0], ['E', 90], ['S', 180], ['W', 270]].forEach(([t, a]) => {
    const s = Math.sin(a * Math.PI / 180), c = Math.cos(a * Math.PI / 180);
    g += `<text x="${100 + 63 * s}" y="${100 - 63 * c + 5}" text-anchor="middle" font-size="14" font-weight="700" fill="#475467">${t}</text>`;
  });
  if (hdg != null) {  // the aircraft, rotated to its heading
    g += `<g transform="rotate(${hdg} 100 100)"><path d="M100 84 L103 96 L116 103 L116 106 L103 103 L102.5 112 L107 115 L107 117 L100 115.5 L93 117 L93 115 L97.5 112 L97 103 L84 106 L84 103 L97 96 Z" fill="#b3261e"/></g>`;
  }
  if (w.dir == null) {
    g += `<circle cx="100" cy="100" r="40" fill="none" stroke="#3b6fd4" stroke-width="4" stroke-dasharray="8 6"/>`;
  } else if (w.kt > 0) {
    // Arrow from the edge the wind comes FROM towards the centre.
    g += `<g transform="rotate(${w.dir} 100 100)"><line x1="100" y1="16" x2="100" y2="70" stroke="${windColor(w)}" stroke-width="7" stroke-linecap="round"/>` +
         `<path d="M100 80 L89 64 L111 64 Z" fill="${windColor(w)}"/><circle cx="100" cy="14" r="9" fill="#fff" stroke="${windColor(w)}" stroke-width="3"/></g>`;
  }
  return g;
}

function cuRender() {
  const w = cu.wind;
  $('cu_dial').innerHTML = dialSvg();
  $('cu_vrb').checked = w.dir == null;
  $('cu_windtxt').textContent = w.kt ? (w.dir == null ? 'VRB' : String(w.dir || 360).padStart(3, '0') + '°') + ' / ' + w.kt + (w.gust_kt > w.kt ? 'G' + w.gust_kt : '') + ' kt' : T('calm');
  $('cu_kt').value = w.kt; $('cu_kt_v').textContent = w.kt + ' kt';
  $('cu_gust').value = w.gust_kt || 0; $('cu_gust_v').textContent = w.gust_kt > w.kt ? w.gust_kt + ' kt' : '–';
  $('cu_var').value = w.var || 0; $('cu_var_v').textContent = w.var ? '±' + w.var + '°' : '–';
  // Components relative to the aircraft heading.
  if (!lastPos) $('cu_rel').innerHTML = `<span class="muted">${T('cuNoHdg')}</span>`;
  else if (w.dir == null || !w.kt) $('cu_rel').innerHTML = '';
  else {
    const r = (w.dir - lastPos.hdg) * Math.PI / 180, h = Math.round(w.kt * Math.cos(r)), x = Math.round(w.kt * Math.sin(r));
    $('cu_rel').innerHTML = T('cuRel')(h >= 0 ? T('cuHead')(h) : T('cuTail')(-h), T('cuCross')(Math.abs(x), x >= 0 ? T('cuR') : T('cuL')), 0, norm(lastPos.hdg));
  }
  const vis = VIS.reduce((b, v) => Math.abs(v - Math.min(cu.vis_m, 100000)) < Math.abs(b - Math.min(cu.vis_m, 100000)) ? v : b, VIS[0]);
  $('cu_vis').value = vis;
  $('cu_wx').value = cu.wx.type;
  $('cu_int').querySelectorAll('button').forEach(b => { b.className = b.dataset.v === (cu.wx.intensity || '') ? 'on' : ''; b.disabled = WX_NO_INT.has(cu.wx.type); });
  $('cu_temp').value = cu.temp; $('cu_temp_v').textContent = cu.temp + '°C';
  $('cu_dew').value = cu.dew; $('cu_dew_v').textContent = cu.dew + '°C';
  $('cu_qnh').value = cu.qnh; $('cu_qnh_v').textContent = cu.qnh;
  $('cu_qnh_in').textContent = 'QNH ' + cu.qnh + ' hPa = ' + (cu.qnh / 33.8639).toFixed(2) + ' inHg';
  cuLayers();
}

function cuLayers() {
  const box = $('cu_layers'), focus = document.activeElement && box.contains(document.activeElement);
  if (focus) return;  // do not rebuild while typing a base
  box.replaceChildren();
  for (let i = 0; i < 3; i++) {
    const c = cu.clouds[i] || {cover: '', base_ft: 1000 * (i + 1) * 2, cb: false};
    const row = document.createElement('div'); row.className = 'layer';
    row.innerHTML = `<select data-i="${i}" data-k="cover"><option value="">${T('noCloud')}</option>` +
      ['FEW', 'SCT', 'BKN', 'OVC'].map(k => `<option value="${k}"${c.cover === k ? ' selected' : ''}>${T('covers')[k]}</option>`).join('') + '</select>' +
      `<input type="number" data-i="${i}" data-k="base_ft" min="0" max="40000" step="100" value="${c.base_ft}" ${c.cover ? '' : 'disabled'}> ft` +
      `<label class="row muted"><input type="checkbox" data-i="${i}" data-k="cb" ${c.cb ? 'checked' : ''} ${c.cover ? '' : 'disabled'}>${T('cb')}</label>`;
    box.append(row);
    if (!cu.clouds[i]) break;  // one empty row at a time
  }
}
$('cu_layers').addEventListener('change', e => {
  const i = +e.target.dataset.i, k = e.target.dataset.k;
  if (!k) return;
  const c = cu.clouds[i] || {cover: '', base_ft: 1000 * (i + 1) * 2, cb: false};
  c[k] = k === 'cb' ? e.target.checked : k === 'base_ft' ? Math.max(0, Math.min(40000, Math.round((+e.target.value || 0) / 100) * 100)) : e.target.value;
  if (k === 'cover' && !c.cover) cu.clouds.splice(i); else cu.clouds[i] = c;
  e.target.blur(); cuChanged();
});

function cuChanged() {
  if (cu.dew > cu.temp) cu.dew = cu.temp;
  cuRender();
  try { localStorage.setItem('cuForm', JSON.stringify(cu)); } catch (e) {}
  clearTimeout(cuPrevTimer);
  cuPrevTimer = setTimeout(async () => {
    try { $('cu_metar').textContent = (await (await POST('/api/custom/preview', cuPayload())).json()).metar; } catch (e) {}
  }, 150);
}
function cuPayload() {
  return Object.assign({}, cu, {scope: document.querySelector('input[name=cu_scope]:checked').value,
                               icao: $('cu_icao').value.trim().toUpperCase(), seconds: +$('cu_secs').value});
}

// Dragging on the dial sets where the wind comes from (10° steps, 1° with Shift).
function dialAngle(e) {
  const r = $('cu_dial').getBoundingClientRect();
  const a = Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) * 180 / Math.PI;
  const step = e.shiftKey ? 1 : 10;
  return norm(Math.round(a / step) * step) || 360;
}
let dialDrag = false;
$('cu_dial').addEventListener('pointerdown', e => { dialDrag = true; $('cu_dial').setPointerCapture(e.pointerId); cuSetDir(dialAngle(e)); });
$('cu_dial').addEventListener('pointermove', e => { if (dialDrag) cuSetDir(dialAngle(e)); });
$('cu_dial').addEventListener('pointerup', () => { dialDrag = false; });
$('cu_dial').addEventListener('wheel', e => { e.preventDefault(); if (cu.wind.dir != null) cuSetDir(norm(cu.wind.dir + (e.deltaY > 0 ? 10 : -10)) || 360); }, {passive: false});
function cuSetDir(d) { cu.wind.dir = d; if (!cu.wind.kt) cu.wind.kt = 10; cuChanged(); }

$('cu_vrb').onchange = () => { cu.wind.dir = $('cu_vrb').checked ? null : (lastPos ? norm(Math.round(lastPos.hdg / 10) * 10) || 360 : 270); cuChanged(); };
$('cu_kt').oninput = () => { cu.wind.kt = +$('cu_kt').value; if (cu.wind.kt && cu.wind.dir === 0) cu.wind.dir = 360; cuChanged(); };
$('cu_gust').oninput = () => { cu.wind.gust_kt = +$('cu_gust').value; cuChanged(); };
$('cu_var').oninput = () => { cu.wind.var = +$('cu_var').value; cuChanged(); };
$('cu_vis').onchange = () => { cu.vis_m = +$('cu_vis').value; cuChanged(); };
$('cu_wx').onchange = () => { cu.wx.type = $('cu_wx').value; if (WX_NO_INT.has(cu.wx.type)) cu.wx.intensity = ''; cuChanged(); };
$('cu_int').onclick = e => { if (e.target.dataset.v != null && !e.target.disabled) { cu.wx.intensity = e.target.dataset.v; cuChanged(); } };
$('cu_temp').oninput = () => { cu.temp = +$('cu_temp').value; cuChanged(); };
$('cu_dew').oninput = () => { cu.dew = Math.min(+$('cu_dew').value, cu.temp); cuChanged(); };
$('cu_qnh').oninput = () => { cu.qnh = +$('cu_qnh').value; cuChanged(); };
['cu_icao', 'cu_secs'].forEach(id => $(id).addEventListener('input', cuChanged));
document.querySelectorAll('input[name=cu_scope]').forEach(r => r.onchange = cuChanged);
$('cu_quick').onclick = e => {
  const q = e.target.dataset.q; if (!q) return;
  if (q === 'calm') { cu.wind = {dir: 360, kt: 0, gust_kt: 0, var: 0}; return cuChanged(); }
  const hdg = lastPos ? lastPos.hdg : 0, off = {head: 0, xr: 90, tail: 180, xl: 270}[q];
  cu.wind.dir = norm(Math.round((hdg + off) / 10) * 10) || 360;
  if (!cu.wind.kt) cu.wind.kt = 15;
  cuChanged();
};
$('cu_preset').onchange = () => {
  const v = $('cu_preset').value; if (!v) return;
  const src = v.startsWith('p:') ? PRESETS[v.slice(2)] : cuMine()[v.slice(2)];
  if (!src) return;
  const f = JSON.parse(JSON.stringify(src));
  if (f.rel != null) { f.wind.dir = norm(Math.round(((lastPos ? lastPos.hdg : 0) + f.rel) / 10) * 10) || 360; delete f.rel; }
  cu = f; cuChanged();
};
$('cu_save').onclick = () => {
  const name = (prompt(T('cuSaveAsk')) || '').trim().slice(0, 40); if (!name) return;
  const mine = cuMine(); mine[name] = JSON.parse(JSON.stringify(cu));
  try { localStorage.setItem('cuPresets', JSON.stringify(mine)); } catch (e) {}
  cuLang(); $('cu_preset').value = 'm:' + name;
};
$('cu_del').onclick = () => {
  const v = $('cu_preset').value; if (!v.startsWith('m:')) return;
  const mine = cuMine(); delete mine[v.slice(2)];
  try { localStorage.setItem('cuPresets', JSON.stringify(mine)); } catch (e) {}
  cuLang();
};
$('cu_load').onclick = async () => {
  $('cu_srcmsg').textContent = '';
  const r = await (await fetch('/api/custom/from?icao=' + encodeURIComponent($('cu_src').value))).json();
  if (r.error) { $('cu_srcmsg').textContent = r.error; return; }
  cu = r.form; if (cu.wind.dir === 0 && cu.wind.kt) cu.wind.dir = 360;
  $('cu_srcmsg').innerHTML = `<span class="raw">${esc(r.raw)}</span>`;
  cuChanged();
};
$('cu_apply').onclick = async () => {
  $('cu_msg').textContent = '…';
  let r; try { r = await (await POST('/api/custom/apply', cuPayload())).json(); } catch (e) { r = {error: String(e)}; }
  $('cu_msg').textContent = r.error || r.note || '';
  $('cu_msg').className = 'muted' + (r.error ? ' warn' : '');
  tick();
};
$('cu_clear').onclick = async () => {
  if (!confirm(T('cuConfirmClear'))) return;
  await POST('/api/custom/clear'); $('cu_msg').textContent = ''; tick();
};
let cuLastHdg = null;
function cuState(c) {
  $('cu_active').style.display = c.active ? '' : 'none';
  $('cu_clear').disabled = !c.active;
  $('cu_badge').textContent = c.active ? '● ' + (lang === 'es' ? 'activo' : 'active') : '';
  $('cu_badge').style.color = c.active ? '#c2410c' : '';
  if (c.active) {
    $('cu_active').innerHTML = `<b>${T('cuActive')}</b>${c.scope === 'station' ? ' · ' + esc(c.icao) : ''}<br><span class="raw">${esc(c.metar)}</span>` +
      (c.note ? `<br>${esc(c.note)}` : '');
    if (!cuLoadedFromServer && c.form && c.form.wind) {  // page reloaded while custom weather is on: show it
      cuLoadedFromServer = true; cu = c.form;
      document.querySelector(`input[name=cu_scope][value=${c.scope === 'station' ? 'station' : 'area'}]`).checked = true;
      $('cu_icao').value = c.icao || ''; cuChanged();
    }
  }
  cuLoadedFromServer = true;
  const h = lastPos ? Math.round(lastPos.hdg) : null;
  if (h !== cuLastHdg && $('cu').open) { cuLastHdg = h; cuRender(); }
}
try { $('cu').open = location.hash === '#custom' || localStorage.getItem('cuOpen') === '1'; } catch (e) {}
$('cu').addEventListener('toggle', () => { try { localStorage.setItem('cuOpen', $('cu').open ? '1' : '0'); } catch (e) {} if ($('cu').open) cuRender(); });
cuLang(); cuChanged();

tick(); setInterval(tick, 3000);
</script>
</body>
</html>
